name: Windows TX and RX executables
on:
  push:
    branches: [codex/windows-executables]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-windows.txt
      - name: Build standalone executables
        run: python packaging/build_windows.py
      - name: Smoke test standalone executables outside source directory
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE/dist/TX.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'TX self-test failed' }
          & "$env:GITHUB_WORKSPACE/dist/RX.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'RX self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: COSMOS-Windows-x64
          path: dist/*
          if-no-files-found: error
